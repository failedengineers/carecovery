{% if page_obj and page_obj.has_other_pages %}
<div class="pagination"><span>Showing page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>{% else %}<span class="disabled">← Previous</span>{% endif %}{% if page_obj.has_next %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Next →</a>{% else %}<span class="disabled">Next →</span>{% endif %}</div></div>
{% endif %}
