{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password · CareCovery</title><link rel="stylesheet" href="{% static 'crm/app.css' %}"></head><body><main class="login-page"><section class="login-panel"><div class="login-box"><span class="eyebrow">ACCOUNT SECURITY</span><h2>Change your password</h2><form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<em class="field-error">{{ error }}</em>{% endfor %}{% endfor %}<button class="btn btn-primary btn-full" type="submit">Update password</button></form><p class="login-legal"><a href="{% url 'dashboard' %}">Back to workspace</a></p></div></section></main></body></html>
